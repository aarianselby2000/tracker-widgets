plugins { id 'com.android.application' }

android {
    namespace 'com.tracker.widgets'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tracker.widgets'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '1.7'
        // owner/repo whose GitHub releases hold new versions (see Updater.java)
        buildConfigField 'String', 'UPDATE_REPO', '"' + (project.findProperty('updateRepo') ?: 'aarianselby2000/tracker-widgets') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
}
